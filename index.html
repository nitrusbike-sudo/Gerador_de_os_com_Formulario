<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Nitros Bike - Sistema OS</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff0000">
    <!-- HTML2Canvas para gerar a imagem digital -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ===== ESTILOS UI - PAINEL ===== */
        :root {
            --red: #dc2626;
            --dark: #111827;
            --gray: #4b5563;
            --light-gray: #f3f4f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            border-top: 6px solid var(--red);
        }
        .header {
            text-align: center;
            padding: 20px;
            background: var(--light-gray);
            border-bottom: 1px solid #ddd;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            color: var(--dark);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .content {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--dark);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
        }
        .form-group textarea {
            resize: vertical;
            height: 80px;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--red);
            outline: none;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }
        
        /* Botões UI */
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            margin-bottom: 10px;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-red { background: var(--red); color: white; }
        .btn-dark { background: var(--dark); color: white; }
        .btn-gray { background: var(--gray); color: white; }
        
        #tela-print {
            display: none;
        }

        /* ===== ESTILOS ESTRITOS DO CUPOM TÉRMICO ===== */
        #render-target {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            background: #f9fafb;
            padding: 20px 0;
            border-radius: 8px;
            border: 1px dashed #ccc;
        }
        .cupom-thermal {
            width: 160px;
            padding: 10px;
            background: white;
            color: black;
            font-family: 'Courier New', Courier, monospace;
            border: 1px solid #000;
            margin: 0 auto;
        }
        .cupom-header { text-align: center; }
        .cupom-header img { width: 100%; height: auto; margin-bottom: 5px; display: block; }
        .titulo {
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;
            font-weight: bold;
            margin: 5px 0;
            padding: 2px 0;
            text-align: center;
        }
        .campo {
            font-size: 12px;
            margin: 4px 0;
            line-height: 1.1;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .total {
            border: 2px solid #000;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            padding: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Gerador OS - Nitros Bike</h1>
        </div>
        
        <div class="content">
            <!-- TELA 1: FORMULÁRIO -->
            <div id="tela-form">
                <div class="form-group">
                    <label>Número da OS (Automático)</label>
                    <input type="number" id="f-os" readonly style="background: #f3f4f6; font-weight: bold;">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" id="f-nome" placeholder="Nome do cliente">
                    </div>
                    <div class="form-group">
                        <label>Sobrenome</label>
                        <input type="text" id="f-sobrenome" placeholder="Sobrenome">
                    </div>
                </div>

                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" id="f-fone" placeholder="(21) 90000-0000" maxlength="15" inputmode="numeric" oninput="this.value = mascaraTelefone(this.value)">
                </div>
                
                <div class="form-group">
                    <label>Serviço Solicitado</label>
                    <textarea id="f-servico" placeholder="Detalhes do serviço..."></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Data de Entrega</label>
                        <input type="text" id="f-entrega" placeholder="DD-MM-YYYY" maxlength="10" inputmode="numeric" oninput="this.value = mascaraData(this.value)">
                    </div>
                    <div class="form-group">
                        <label>Valor do Serviço (R$)</label>
                        <input type="text" id="f-valor" placeholder="0,00" inputmode="decimal" oninput="this.value = mascaraValor(this.value)">
                    </div>
                </div>
                
                <button class="btn btn-red" onclick="gerarOS()">1. CONFIRMAR E GERAR OS</button>
            </div>

            <!-- TELA 2: PREVIEW E IMPRESSÃO -->
            <div id="tela-print">
                
                <div id="render-target">
                    <!-- CUPOM IDÊNTICO AO ORIGINAL (index.html) -->
                    <div id="meu-cupom" class="cupom-thermal">
                        <div class="cupom-header">
                            <img src="logos/logo_os.png" id="img-logo-os" onerror="this.style.display='none'">
                            <div class="titulo">ORDEM DE SERVIÇO</div>
                            <div id="v-numero" style="font-size: 20px; font-weight: bold;">#000</div>
                        </div>
                        <div class="campo"><b>CLIENTE:</b><br><span id="v-nome">---</span></div>
                        <div class="campo"><b>FONE:</b> <span id="v-fone">---</span></div>
                        <div style="border-top: 1px dashed #000; margin: 5px 0;"></div>
                        <div class="campo"><b>SERVIÇO:</b><br><span id="v-servico">---</span></div>
                        <div class="campo"><b>ENTREGA:</b> <span id="v-entrega">---</span></div>
                        <div class="total">TOTAL R$ <span id="v-total">0,00</span></div>
                        <div style="text-align:center; font-size: 10px; margin-top: 10px;">
                            Assinatura:<br><br>_______________________<br>
                            <small id="v-emissao"></small>
                        </div>
                    </div>
                </div>

                <button class="btn btn-dark" onclick="imprimir()">2. IMPRIMIR PAPEL</button>
                <button class="btn btn-gray" onclick="baixarDigital()" style="background: #374151;">3. BAIXAR DIGITAL</button>
                <button class="btn btn-gray" onclick="voltar()" style="background: #9ca3af; margin-top: 20px;">⬅ Voltar e Editar</button>
            </div>
        </div>
    </div>

    <script>
        // Inicialização e Numeração Automática da OS
        const storageKey = 'nitros_bike_os_counter';

        // ===== MÁSCARAS DE FORMATAÇÃO =====
        function mascaraTelefone(valor) {
            valor = valor.replace(/\D/g, '').slice(0, 11);
            if (valor.length <= 2) return valor.length ? '(' + valor : '';
            if (valor.length <= 7) return '(' + valor.slice(0, 2) + ') ' + valor.slice(2);
            return '(' + valor.slice(0, 2) + ') ' + valor.slice(2, 7) + '-' + valor.slice(7);
        }

        function mascaraData(valor) {
            valor = valor.replace(/\D/g, '').slice(0, 8);
            if (valor.length <= 2) return valor;
            if (valor.length <= 4) return valor.slice(0, 2) + '-' + valor.slice(2);
            return valor.slice(0, 2) + '-' + valor.slice(2, 4) + '-' + valor.slice(4);
        }

        function mascaraValor(valor) {
            // Remove tudo que não é dígito
            valor = valor.replace(/\D/g, '');
            if (!valor) return '';
            // Converte para centavos → formato brasileiro (1.234,56)
            const num = (parseInt(valor, 10) / 100).toFixed(2);
            const parts = num.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            return parts[0] + ',' + parts[1];
        }

        function initOS() {
            let num = localStorage.getItem(storageKey);
            if (!num) {
                num = 201; // Inicia em 201 conforme sua necessidade anterior
                localStorage.setItem(storageKey, num);
            }
            document.getElementById('f-os').value = num;
            // Data de entrega começa vazia (usuário preenche)
            document.getElementById('f-entrega').value = '';
        }

        function gerarOS() {
            // Coletar dados
            const os = document.getElementById('f-os').value;
            const nome = document.getElementById('f-nome').value.trim();
            const sobrenome = document.getElementById('f-sobrenome').value.trim();
            const cliente = (nome + ' ' + sobrenome).trim() || 'Não informado';
            
            const fone = document.getElementById('f-fone').value || '---';
            const servico = document.getElementById('f-servico').value || '---';
            const entrega = document.getElementById('f-entrega').value || '---';
            const valor = document.getElementById('f-valor').value || '0,00';
            
            const hojeData = new Date();
            const dia = String(hojeData.getDate()).padStart(2, '0');
            const mes = String(hojeData.getMonth() + 1).padStart(2, '0');
            const ano = hojeData.getFullYear();
            const hora = String(hojeData.getHours()).padStart(2, '0');
            const min = String(hojeData.getMinutes()).padStart(2, '0');
            const hojeStr = `${dia}/${mes}/${ano} ${hora}:${min}`;

            // Preencher campos no cupom (IDs iguais ao original)
            document.getElementById('v-numero').innerText = '#' + os;
            document.getElementById('v-nome').innerText = cliente;
            document.getElementById('v-fone').innerText = fone;
            document.getElementById('v-servico').innerText = servico;
            document.getElementById('v-entrega').innerText = entrega;
            document.getElementById('v-total').innerText = valor;
            document.getElementById('v-emissao').innerText = 'Emitido em: ' + hojeStr;

            // Avançar para a tela de impressão
            document.getElementById('tela-form').style.display = 'none';
            document.getElementById('tela-print').style.display = 'block';
            
            // Incrementa o contador de OS para a próxima (só salva no cache após gerar)
            localStorage.setItem(storageKey, parseInt(os) + 1);
        }

        function voltar() {
            document.getElementById('tela-print').style.display = 'none';
            document.getElementById('tela-form').style.display = 'block';
            initOS(); // Puxa o próximo número gerado
        }

        function imprimir() {
            // CÓPIA LITERAL do index.html original (o que funciona)
            const conteudo = document.getElementById('meu-cupom').innerHTML;
            const win = window.open('', '', 'width=300,height=600');
            win.document.write('<html><head><style>body{font-family:monospace;width:160px;margin:0;padding:0;} img{width:100%;} .titulo{border-top:1px solid #000;border-bottom:1px solid #000;text-align:center;font-weight:bold;margin:5px 0;} .total{border:2px solid #000;text-align:center;font-size:18px;font-weight:bold;margin:10px 0;padding:5px;}</style></head><body>' + conteudo + '</body></html>');
            win.document.close();
            win.focus();
            setTimeout(() => { win.print(); win.close(); }, 500);
        }

        function baixarDigital() {
            const cupomTarget = document.getElementById('meu-cupom');
            html2canvas(cupomTarget, {
                scale: 3,
                useCORS: true,
                backgroundColor: "#ffffff",
                width: 160,
                windowWidth: 160
            }).then(canvas => {
                const link = document.createElement('a');
                const osNum = document.getElementById('v-numero').innerText.replace('#','');
                link.download = 'OS_Nitros_Bike_' + osNum + '.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        // Service Worker (permite instalar como app + uso offline)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // Inicializa ao carregar a página
        window.onload = initOS;
    </script>
</body>
</html>
